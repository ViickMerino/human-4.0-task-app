<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human 3.0 Task App</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 24px; font-size: 1.5rem; }
    .pillar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    button {
      background: #1e293b;
      color: #38bdf8;
      border: 2px solid #38bdf8;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Select Pillar</h1>
  <div class="pillar-grid">
    <button>Spiritual</button>
    <button>Physical</button>
    <button>Mental</button>
    <button>Vocational</button>
  </div>
</body>
</html>
