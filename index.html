<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Human 3.0 Focus Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #0a0a0c;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px;
    }

    /* SIDE TABS CONTAINER */
    .app-layout {
      display: flex;
      width: 100%;
      max-width: 440px;
      gap: 6px;
      align-items: flex-start;
    }

    .side-tabs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    .side-tab-btn {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      background: #121216;
      color: #a1a1aa;
      border: 1px solid #2a2a32;
      border-radius: 8px 0 0 8px;
      padding: 14px 6px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      width: 34px;
      text-align: center;
    }

    .side-tab-btn.active {
      background: #0a0a0c;
      color: #d4af37;
      border: 1px solid #d4af37;
      border-right: none;
      box-shadow: -4px 0 12px rgba(212, 175, 55, 0.2);
    }

    .tab-content {
      flex: 1;
      width: 100%;
    }

    .card {
      background: #121216;
      padding: 20px;
      border-radius: 14px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border: 1px solid #2a2a32;
      margin-bottom: 16px;
    }
    h2, h3 { 
      margin-top: 0; 
      color: #d4af37; 
      text-align: center; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
    }
    
    .level-container { text-align: center; margin-bottom: 10px; }
    .level-badge { 
      font-size: 1.2rem; 
      font-weight: 900; 
      color: #f5d77f; 
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.4); 
    }
    .xp-text { font-size: 0.85rem; color: #a1a1aa; margin-top: 4px; font-weight: bold; }
    .combo-text { font-size: 0.85rem; color: #d4af37; font-weight: bold; margin-top: 6px; }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #2a2a32;
      background: #0a0a0c;
      color: #fff;
      font-size: 1rem;
    }
    input:focus, select:focus {
      border-color: #d4af37;
      outline: none;
    }
    button.add-btn {
      background: #2a2a32;
      color: #f5d77f;
      border: 1px solid #d4af37;
      font-weight: 800;
      margin-top: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button.now-btn {
      background: linear-gradient(135deg, #d4af37, #f5d77f);
      color: #000;
      font-weight: 900;
      border: none;
      margin-top: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
    }
    button.thrill-btn {
      background: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      font-weight: 800;
      margin-top: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .pillar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .pillar-btn {
      background: #0a0a0c;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    /* HABIT STREAK STYLES */
    .habit-item {
      background: #0a0a0c;
      border: 1px solid #2a2a32;
      padding: 14px;
      border-radius: 10px;
      margin-top: 10px;
    }
    .habit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .habit-title { font-weight: bold; color: #fff; }
    .habit-pillar { font-size: 0.75rem; color: #d4af37; text-transform: uppercase; }
    .streak-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .streak-box {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #121216;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #64748b;
    }
    .streak-box.done {
      background: #d4af37;
      color: #000;
      font-weight: bold;
      border-color: #f5d77f;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    /* FULL-SCREEN LOCKDOWN MODAL */
    .focus-modal-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .focus-card-inner {
      background: #0a0a0c;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 24px 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .focus-task-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 20px 0;
      color: #ffffff;
      line-height: 1.3;
      word-break: break-word;
    }
    .timer-display {
      font-size: 2.5rem;
      font-weight: 900;
      color: #f5d77f;
      margin-bottom: 20px;
      font-family: monospace;
      text-shadow: 0 0 15px rgba(245, 215, 127, 0.4);
    }
    .complete-btn {
      background: linear-gradient(135deg, #d4af37, #f5d77f);
      color: #000;
      font-size: 1.1rem;
      font-weight: 900;
      border: none;
      padding: 16px;
      cursor: pointer;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
      width: 100%;
    }
    .history-list {
      margin-top: 12px;
      text-align: left;
      font-size: 0.9rem;
      color: #cbd5e1;
      display: none;
    }
    .history-item {
      padding: 8px 0;
      border-bottom: 1px solid #2a2a32;
    }
    #appContent {
      display: none;
      width: 100%;
    }
    .pin-input {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 8px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="card" id="loginCard" style="max-width: 400px;">
    <h2>Access Engine</h2>
    <input type="text" id="usernameInput" placeholder="Your Name or Nickname">
    <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="4-DIGIT PIN">
    <button class="now-btn" onclick="attemptLogin()">ENTER FOCUS MODE</button>
    <p id="loginError" style="color: #ef4444; text-align: center; font-size: 0.85rem; display: none; margin-top: 10px;">Incorrect PIN (Valid PINs: 1234, 1013, 1116, 0325)</p>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContent">
    <div class="app-layout">
      
      <!-- SIDE NOTEBOOK TABS -->
      <div class="side-tabs">
        <button class="side-tab-btn active" id="tabBtnTasks" onclick="switchTab('tasks')">Tasks</button>
        <button class="side-tab-btn" id="tabBtnHabits" onclick="switchTab('habits')">Habits</button>
      </div>

      <!-- MAIN CONTENT VIEW -->
      <div class="tab-content">
        
        <!-- STATS HEADER -->
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span id="activeUserBadge" style="color: #d4af37; font-weight: bold; font-size: 0.85rem;">👤 USER</span>
            <button onclick="logout()" style="width: auto; padding: 4px 8px; margin: 0; font-size: 0.75rem; background: #2a2a32; color: #a1a1aa; border: none;">Logout</button>
          </div>
          <div class="level-container">
            <div class="level-badge" id="levelDisplay">⚡ HUMAN LEVEL: 1</div>
            <div class="xp-text" id="xpDisplay">TOTAL XP: 0 / 100</div>
            <div class="combo-text" id="comboDisplay">🔥 COMBO: 0x MULTIPLIER</div>
          </div>
        </div>

        <!-- TASKS SECTION VIEW -->
        <div id="tasksView">
          <div class="card">
            <h2>Add Task</h2>
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            
            <select id="pillarSelect">
              <option value="Home">Home</option>
              <option value="Work">Work</option>
              <option value="Viita Inc">Viita Inc</option>
              <option value="Personal">Personal</option>
            </select>

            <select id="eisenhowerSelect">
              <option value="1">🔥 Urgent & Important (+100 XP)</option>
              <option value="2">📅 Important, Not Urgent (+75 XP)</option>
              <option value="3">⚡ Urgent, Not Important (+50 XP)</option>
              <option value="4">🧹 Not Urgent & Not Important (+25 XP)</option>
            </select>

            <button class="add-btn" onclick="saveTask(false)">Save to Task Bank</button>
            <button class="now-btn" onclick="saveTask(true)">🚨 DO THIS RIGHT NOW!</button>
          </div>

          <div class="card">
            <h3>Enter Focus Mode</h3>
            <div class="pillar-grid">
              <button class="pillar-btn" onclick="loadFocusTask('Home')">Home</button>
              <button class="pillar-btn" onclick="loadFocusTask('Work')">Work</button>
              <button class="pillar-btn" onclick="loadFocusTask('Viita Inc')">Viita Inc</button>
              <button class="pillar-btn" onclick="loadFocusTask('Personal')">Personal</button>
            </div>
            <button class="thrill-btn" onclick="triggerThrillMode()">🎲 RANDOM THRILL SPRINT</button>
          </div>

          <div class="card">
            <button style="background: #121216; border: 1px solid #2a2a32; color: #a1a1aa;" onclick="toggleHistory()">🏆 View Completed Vault</button>
            <div id="historyList" class="history-list"></div>
          </div>
        </div>

        <!-- HABITS SECTION VIEW -->
        <div id="habitsView" style="display: none;">
          <div class="card">
            <h2>Track Habit</h2>
            <input type="text" id="habitInput" placeholder="New Daily Habit Name...">
            
            <select id="habitPillarSelect">
              <option value="Spiritual">Spiritual</option>
              <option value="Physical">Physical</option>
              <option value="Mental">Mental</option>
              <option value="Vocational">Vocational</option>
            </select>

            <input type="number" id="habitDaysInput" placeholder="Target Days (e.g. 7, 30, 100)" min="1" max="100" value="7">

            <button class="add-btn" onclick="saveHabit()">+ Add Habit Streak</button>
          </div>

          <div class="card">
            <h3>Active Habit Streaks</h3>
            <div id="habitsListContainer"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- FULL-SCREEN FOCUS LOCKDOWN MODAL -->
  <div id="focusModal" class="focus-modal-overlay">
    <div class="focus-card-inner">
      <small id="currentPillarLabel" style="text-transform: uppercase; letter-spacing: 2px; color: #d4af37; font-weight: 900;"></small>
      <div id="focusTaskText" class="focus-task-title">No task selected</div>
      <div id="timerDisplay" class="timer-display">⏱️ 01:00</div>
      <button id="completeBtn" class="complete-btn" onclick="completeCurrentTask()">✅ COMPLETE TASK (+XP)</button>
    </div>
  </div>

  <script>
    // ALLOWED ACCESS CODES
    const ALLOWED_PINS = ["1234", "1013", "1116", "0325"];
    
    let currentTaskIndex = -1;
    let timerInterval = null;
    let secondsLeft = 60;
    let comboStreak = 0;
    let currentUser = "";

    checkExistingSession();

    function attemptLogin() {
      const name = document.getElementById('usernameInput').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      const errorEl = document.getElementById('loginError');

      if (!name) {
        alert('Please enter your name!');
        return;
      }

      if (ALLOWED_PINS.includes(pin)) {
        currentUser = name;
        localStorage.setItem('activeUser', name);
        errorEl.style.display = 'none';
        showApp();
      } else {
        errorEl.style.display = 'block';
      }
    }

    function checkExistingSession() {
      const savedUser = localStorage.getItem('activeUser');
      if (savedUser) {
        currentUser = savedUser;
        showApp();
      }
    }

    function showApp() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('appContent').style.display = 'block';
      document.getElementById('activeUserBadge').innerText = `👤 USER: ${currentUser.toUpperCase()}`;
      updateStatsUI();
      renderHabits();
    }

    function logout() {
      localStorage.removeItem('activeUser');
      location.reload();
    }

    function switchTab(tab) {
      const tasksView = document.getElementById('tasksView');
      const habitsView = document.getElementById('habitsView');
      const tabBtnTasks = document.getElementById('tabBtnTasks');
      const tabBtnHabits = document.getElementById('tabBtnHabits');

      if (tab === 'tasks') {
        tasksView.style.display = 'block';
        habitsView.style.display = 'none';
        tabBtnTasks.classList.add('active');
        tabBtnHabits.classList.remove('active');
      } else {
        tasksView.style.display = 'none';
        habitsView.style.display = 'block';
        tabBtnTasks.classList.remove('active');
        tabBtnHabits.classList.add('active');
        renderHabits();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsLeft = 60;
      updateTimerUI();

      timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerUI();
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
        }
      }, 1000);
    }

    function updateTimerUI() {
      const mins = Math.floor(secondsLeft / 60);
      const secs = secondsLeft % 60;
      document.getElementById('timerDisplay').innerText = `⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function triggerDopamineEffect() {
      confetti({ 
        particleCount: 150, 
        spread: 90, 
        origin: { y: 0.5 },
        colors: ['#d4af37', '#f5d77f', '#ffffff']
      });

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function saveTask(doImmediately = false) {
      const text = document.getElementById('taskInput').value;
      const pillar = document.getElementById('pillarSelect').value;
      let priority = document.getElementById('eisenhowerSelect').value;

      if (!text) return;

      if (doImmediately) priority = "0";

      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      tasks.push({ text, pillar, priority, done: false, createdBy: currentUser });
      localStorage.setItem('tasks', JSON.stringify(tasks));

      document.getElementById('taskInput').value = '';

      if (doImmediately) {
        loadFocusTask(pillar);
      }
    }

    function loadFocusTask(pillar) {
      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      
      const matchingTasks = tasks
        .map((t, idx) => ({ ...t, originalIndex: idx }))
        .filter(t => t.pillar === pillar && !t.done)
        .sort((a, b) => Number(a.priority) - Number(b.priority));

      const focusModal = document.getElementById('focusModal');

      if (matchingTasks.length === 0) {
        alert(`🎉 All clear! No active tasks in ${pillar}.`);
        focusModal.style.display = 'none';
        clearInterval(timerInterval);
        return;
      }

      focusModal.style.display = 'flex';

      const topTask = matchingTasks[0];
      currentTaskIndex = topTask.originalIndex;

      document.getElementById('currentPillarLabel').innerText = `🚨 ${pillar} LOCKDOWN FOCUS`;
      document.getElementById('focusTaskText').innerText = topTask.text;
      
      startTimer();
    }

    function triggerThrillMode() {
      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const activeTasks = tasks
        .map((t, idx) => ({ ...t, originalIndex: idx }))
        .filter(t => !t.done);

      if (activeTasks.length === 0) {
        alert('Add some tasks first!');
        return;
      }

      const randomTask = activeTasks[Math.floor(Math.random() * activeTasks.length)];
      currentTaskIndex = randomTask.originalIndex;

      const focusModal = document.getElementById('focusModal');
      focusModal.style.display = 'flex';

      document.getElementById('currentPillarLabel').innerText = `🎲 THRILL LOCKDOWN: ${randomTask.pillar}`;
      document.getElementById('focusTaskText').innerText = randomTask.text;

      startTimer();
    }

    function completeCurrentTask() {
      if (currentTaskIndex === -1) return;

      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const task = tasks[currentTaskIndex];
      task.done = true;
      task.completedBy = currentUser;
      localStorage.setItem('tasks', JSON.stringify(tasks));

      comboStreak++;

      let xpGained = 25;
      if (task.priority === "0" || task.priority === "1") xpGained = 100;
      else if (task.priority === "2") xpGained = 75;
      else if (task.priority === "3") xpGained = 50;

      xpGained = Math.round(xpGained * (1 + (comboStreak - 1) * 0.2));

      triggerDopamineEffect();
      addXP(xpGained);

      document.getElementById('focusModal').style.display = 'none';

      const activePillar = task.pillar;
      loadFocusTask(activePillar);
    }

    function addXP(amount) {
      let currentXP = Number(localStorage.getItem('totalXP') || 0);
      currentXP += amount;
      localStorage.setItem('totalXP', currentXP);

      updateStatsUI();
    }

    function updateStatsUI() {
      const currentXP = Number(localStorage.getItem('totalXP') || 0);
      const level = Math.floor(currentXP / 100) + 1;
      const xpInCurrentLevel = currentXP % 100;

      document.getElementById('levelDisplay').innerText = `⚡ HUMAN LEVEL: ${level}`;
      document.getElementById('xpDisplay').innerText = `TOTAL XP: ${currentXP} (${xpInCurrentLevel}/100 to Next Level)`;
      document.getElementById('comboDisplay').innerText = `🔥 COMBO: ${comboStreak}x STREAK MULTIPLIER`;
    }

    function toggleHistory() {
      const historyList = document.getElementById('historyList');
      if (historyList.style.display === 'block') {
        historyList.style.display = 'none';
        return;
      }

      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const doneTasks = tasks.filter(t => t.done);

      if (doneTasks.length === 0) {
        historyList.innerHTML = '<div class="history-item">No completed tasks yet.</div>';
      } else {
        historyList.innerHTML = doneTasks.map(t => `
          <div class="history-item">✅ <strong>[${t.pillar}]</strong> ${t.text} <small style="color:#d4af37;">(By: ${t.completedBy || 'Unknown'})</small></div>
        `).join('');
      }

      historyList.style.display = 'block';
    }

    /* HABITS LOGIC */
    function saveHabit() {
      const name = document.getElementById('habitInput').value.trim();
      const pillar = document.getElementById('habitPillarSelect').value;
      const days = parseInt(document.getElementById('habitDaysInput').value) || 7;

      if (!name) return alert('Enter habit name!');

      const habits = JSON.parse(localStorage.getItem('habits') || '[]');
      habits.push({
        id: Date.now(),
        name,
        pillar,
        targetDays: days,
        completedDays: 0,
        lastUpdated: ""
      });
      localStorage.setItem('habits', JSON.stringify(habits));

      document.getElementById('habitInput').value = '';
      renderHabits();
    }

    function renderHabits() {
      const habits = JSON.parse(localStorage.getItem('habits') || '[]');
      const container = document.getElementById('habitsListContainer');

      if (habits.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; font-size:0.9rem;">No active habits tracked yet.</p>';
        return;
      }

      container.innerHTML = habits.map((h, idx) => {
        let boxes = '';
        for (let i = 1; i <= h.targetDays; i++) {
          const isDone = i <= h.completedDays;
          boxes += `<div class="streak-box ${isDone ? 'done' : ''}">${i}</div>`;
        }

        const isFullyComplete = h.completedDays >= h.targetDays;

        return `
          <div class="habit-item">
            <div class="habit-header">
              <div>
                <div class="habit-title">${h.name}</div>
                <div class="habit-pillar">${h.pillar} • ${h.completedDays}/${h.targetDays} Days</div>
              </div>
              ${!isFullyComplete ? `<button style="width:auto; padding:8px 12px; margin:0; font-size:0.8rem;" class="now-btn" onclick="checkInHabit(${idx})">✅ Check-In</button>` : `<span style="color:#d4af37; font-weight:bold; font-size:0.85rem;">🏆 COMPLETED</span>`}
            </div>
            <div class="streak-grid">${boxes}</div>
          </div>
        `;
      }).join('');
    }

    function checkInHabit(index) {
      const habits = JSON.parse(localStorage.getItem('habits') || '[]');
      const habit = habits[index];

      if (habit.completedDays < habit.targetDays) {
        habit.completedDays += 1;
        localStorage.setItem('habits', JSON.stringify(habits));
        
        triggerDopamineEffect();
        addXP(50);
        renderHabits();
      }
    }
  </script>

</body>
</html>
