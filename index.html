<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human 3.0 Focus Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #111827;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #1f293d;
      margin-bottom: 20px;
    }
    h2, h3 { margin-top: 0; color: #ff6b00; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
    
    .level-container { text-align: center; margin-bottom: 10px; }
    .level-badge { font-size: 1.3rem; font-weight: 900; color: #10b981; text-shadow: 0 0 10px rgba(16,185,129,0.3); }
    .xp-text { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; font-weight: bold; }
    .combo-text { font-size: 0.9rem; color: #ff6b00; font-weight: bold; margin-top: 6px; }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #090d16;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .mic-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .mic-btn {
      width: auto;
      background: #1f293d;
      border: 1px solid #ff6b00;
      color: #ff6b00;
      padding: 14px 18px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 1.1rem;
    }
    button.add-btn {
      background: #ff6b00;
      color: #000;
      font-weight: 800;
      border: none;
      margin-top: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }
    button.now-btn {
      background: #10b981;
      color: #000;
      font-weight: 800;
      border: none;
      margin-top: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(16,185,129,0.4);
    }
    button.thrill-btn {
      background: transparent;
      border: 2px solid #ff6b00;
      color: #ff6b00;
      font-weight: 800;
      margin-top: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .pillar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .pillar-btn {
      background: #090d16;
      color: #ff6b00;
      border: 2px solid #ff6b00;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .focus-card {
      background: #090d16;
      color: #fff;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      display: none;
      border: 2px solid #10b981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }
    .focus-task-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 16px 0;
      color: #f8fafc;
    }
    .timer-display {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ff6b00;
      margin-bottom: 12px;
      font-family: monospace;
    }
    .complete-btn {
      background: #10b981;
      color: #000;
      font-size: 1.1rem;
      font-weight: 900;
      border: none;
      padding: 16px;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(16,185,129,0.5);
    }
    .history-list {
      margin-top: 12px;
      text-align: left;
      font-size: 0.9rem;
      color: #cbd5e1;
      display: none;
    }
    .history-item {
      padding: 8px 0;
      border-bottom: 1px solid #1f293d;
    }
  </style>
</head>
<body>

  <!-- STATS HEADER -->
  <div class="card">
    <div class="level-container">
      <div class="level-badge" id="levelDisplay">⚡ HUMAN LEVEL: 1</div>
      <div class="xp-text" id="xpDisplay">TOTAL XP: 0 / 100</div>
      <div class="combo-text" id="comboDisplay">🔥 COMBO: 0x MULTIPLIER</div>
    </div>
  </div>

  <!-- ADD TASK SECTION -->
  <div class="card">
    <h2>Add Task</h2>
    <div class="mic-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?">
      <button type="button" class="mic-btn" onclick="startVoiceInput()" title="Voice Dump">🎤</button>
    </div>
    
    <select id="pillarSelect">
      <option value="Spiritual">Spiritual</option>
      <option value="Physical">Physical</option>
      <option value="Mental">Mental</option>
      <option value="Vocational">Vocational</option>
    </select>

    <select id="eisenhowerSelect">
      <option value="1">🔥 Urgent & Important (+100 XP)</option>
      <option value="2">📅 Important, Not Urgent (+75 XP)</option>
      <option value="3">⚡ Urgent, Not Important (+50 XP)</option>
      <option value="4">🧹 Not Urgent & Not Important (+25 XP)</option>
    </select>

    <button class="add-btn" onclick="saveTask(false)">Save to Task Bank</button>
    <button class="now-btn" onclick="saveTask(true)">🚨 DO THIS RIGHT NOW!</button>
  </div>

  <!-- SELECT PILLAR SECTION -->
  <div class="card">
    <h3>Enter Focus Mode</h3>
    <div class="pillar-grid">
      <button class="pillar-btn" onclick="loadFocusTask('Spiritual')">Spiritual</button>
      <button class="pillar-btn" onclick="loadFocusTask('Physical')">Physical</button>
      <button class="pillar-btn" onclick="loadFocusTask('Mental')">Mental</button>
      <button class="pillar-btn" onclick="loadFocusTask('Vocational')">Vocational</button>
    </div>
    <button class="thrill-btn" onclick="triggerThrillMode()">🎲 RANDOM THRILL SPRINT</button>
  </div>

  <!-- SINGLE FOCUS TASK DISPLAY -->
  <div id="focusCard" class="focus-card">
    <small id="currentPillarLabel" style="text-transform: uppercase; letter-spacing: 1px; color: #ff6b00; font-weight: bold;"></small>
    <div id="focusTaskText" class="focus-task-title">No task selected</div>
    <div id="timerDisplay" class="timer-display">⏱️ 01:00</div>
    <button id="completeBtn" class="complete-btn" onclick="completeCurrentTask()">✅ COMPLETE (+XP)</button>
  </div>

  <!-- COMPLETED VAULT -->
  <div class="card">
    <button style="background: #1f293d; border: 1px solid #334155; color: #94a3b8;" onclick="toggleHistory()">🏆 View Completed Vault</button>
    <div id="historyList" class="history-list"></div>
  </div>

  <script>
    let currentTaskIndex = -1;
    let timerInterval = null;
    let secondsLeft = 60;
    let comboStreak = 0;

    updateStatsUI();

    function startVoiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Voice input is not supported on this browser.');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('taskInput').value = transcript;
      };
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsLeft = 60;
      updateTimerUI();

      timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerUI();
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
        }
      }, 1000);
    }

    function updateTimerUI() {
      const mins = Math.floor(secondsLeft / 60);
      const secs = secondsLeft % 60;
      document.getElementById('timerDisplay').innerText = `⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function triggerDopamineEffect() {
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function saveTask(doImmediately = false) {
      const text = document.getElementById('taskInput').value;
      const pillar = document.getElementById('pillarSelect').value;
      let priority = document.getElementById('eisenhowerSelect').value;

      if (!text) return;

      if (doImmediately) priority = "0";

      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      tasks.push({ text, pillar, priority, done: false });
      localStorage.setItem('tasks', JSON.stringify(tasks));

      document.getElementById('taskInput').value = '';

      if (doImmediately) {
        loadFocusTask(pillar);
      }
    }

    function loadFocusTask(pillar) {
      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      
      const matchingTasks = tasks
        .map((t, idx) => ({ ...t, originalIndex: idx }))
        .filter(t => t.pillar === pillar && !t.done)
        .sort((a, b) => Number(a.priority) - Number(b.priority));

      const focusCard = document.getElementById('focusCard');
      focusCard.style.display = 'block';

      if (matchingTasks.length === 0) {
        document.getElementById('currentPillarLabel').innerText = `${pillar} Pillar Status`;
        document.getElementById('focusTaskText').innerText = `🎉 All clear! No active tasks in ${pillar}.`;
        document.getElementById('timerDisplay').style.display = 'none';
        document.getElementById('completeBtn').style.display = 'none';
        clearInterval(timerInterval);
        return;
      }

      document.getElementById('timerDisplay').style.display = 'block';
      document.getElementById('completeBtn').style.display = 'block';

      const topTask = matchingTasks[0];
      currentTaskIndex = topTask.originalIndex;

      document.getElementById('currentPillarLabel').innerText = `${pillar} Pillar Focus`;
      document.getElementById('focusTaskText').innerText = topTask.text;
      
      startTimer();
      focusCard.scrollIntoView({ behavior: 'smooth' });
    }

    function triggerThrillMode() {
      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const activeTasks = tasks
        .map((t, idx) => ({ ...t, originalIndex: idx }))
        .filter(t => !t.done);

      if (activeTasks.length === 0) {
        alert('Add some tasks first!');
        return;
      }

      const randomTask = activeTasks[Math.floor(Math.random() * activeTasks.length)];
      currentTaskIndex = randomTask.originalIndex;

      const focusCard = document.getElementById('focusCard');
      focusCard.style.display = 'block';
      document.getElementById('timerDisplay').style.display = 'block';
      document.getElementById('completeBtn').style.display = 'block';

      document.getElementById('currentPillarLabel').innerText = `🎲 THRILL SPRINT: ${randomTask.pillar}`;
      document.getElementById('focusTaskText').innerText = randomTask.text;

      startTimer();
      focusCard.scrollIntoView({ behavior: 'smooth' });
    }

    function completeCurrentTask() {
      if (currentTaskIndex === -1) return;

      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const task = tasks[currentTaskIndex];
      task.done = true;
      localStorage.setItem('tasks', JSON.stringify(tasks));

      comboStreak++;

      let xpGained = 25;
      if (task.priority === "0" || task.priority === "1") xpGained = 100;
      else if (task.priority === "2") xpGained = 75;
      else if (task.priority === "3") xpGained = 50;

      xpGained = Math.round(xpGained * (1 + (comboStreak - 1) * 0.2));

      triggerDopamineEffect();
      addXP(xpGained);

      const activePillar = task.pillar;
      loadFocusTask(activePillar);
    }

    function addXP(amount) {
      let currentXP = Number(localStorage.getItem('totalXP') || 0);
      currentXP += amount;
      localStorage.setItem('totalXP', currentXP);

      updateStatsUI();
    }

    function updateStatsUI() {
      const currentXP = Number(localStorage.getItem('totalXP') || 0);
      const level = Math.floor(currentXP / 100) + 1;
      const xpInCurrentLevel = currentXP % 100;

      document.getElementById('levelDisplay').innerText = `⚡ HUMAN LEVEL: ${level}`;
      document.getElementById('xpDisplay').innerText = `TOTAL XP: ${currentXP} (${xpInCurrentLevel}/100 to Next Level)`;
      document.getElementById('comboDisplay').innerText = `🔥 COMBO: ${comboStreak}x STREAK MULTIPLIER`;
    }

    function toggleHistory() {
      const historyList = document.getElementById('historyList');
      if (historyList.style.display === 'block') {
        historyList.style.display = 'none';
        return;
      }

      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const doneTasks = tasks.filter(t => t.done);

      if (doneTasks.length === 0) {
        historyList.innerHTML = '<div class="history-item">No completed tasks yet.</div>';
      } else {
        historyList.innerHTML = doneTasks.map(t => `
          <div class="history-item">✅ <strong>[${t.pillar}]</strong> ${t.text}</div>
        `).join('');
      }

      historyList.style.display = 'block';
    }
  </script>

</body>
</html>
