<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human 3.0 Task App</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button.add-btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      margin-top: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Add New Task</h2>
    <input type="text" id="taskInput" placeholder="What needs to be done?">
    
    <select id="pillarSelect">
      <option value="Spiritual">Spiritual</option>
      <option value="Physical">Physical</option>
      <option value="Mental">Mental</option>
      <option value="Vocational">Vocational</option>
    </select>

    <select id="eisenhowerSelect">
      <option value="1">🔥 Urgent & Important (Do First)</option>
      <option value="2">📅 Important, Not Urgent (Schedule)</option>
      <option value="3">⚡ Urgent, Not Important (Delegate/Quick)</option>
      <option value="4">🧹 Not Urgent & Not Important (Eliminate)</option>
    </select>

    <button class="add-btn" onclick="saveTask()">Add Task to Bank</button>
  </div>

  <script>
    function saveTask() {
      const text = document.getElementById('taskInput').value;
      const pillar = document.getElementById('pillarSelect').value;
      const priority = document.getElementById('eisenhowerSelect').value;

      if (!text) return alert('Enter a task first!');

      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      tasks.push({ text, pillar, priority, done: false });
      localStorage.setItem('tasks', JSON.stringify(tasks));

      document.getElementById('taskInput').value = '';
      alert('Task saved!');
    }
  </script>

</body>
</html>
